<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>JęzykLab — nauka rosyjskiego i hiszpańskiego dla umysłu ścisłego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Paleta zgodna z HUB (semantyczne kolory --lang/--read/--audio, light+dark) */
  :root{
    color-scheme:light;
    --bg:#f3f4f2;--surface:#ffffff;--surface-2:#e9ece8;--panel:#1d2422;
    --ink:#1d2422;--ink-soft:#66706c;--ink-faint:#8a9490;--line:#dfe2de;--line-soft:#eceee9;
    --ru:#3a64a8;--es:#b5741c;--audio:#8a4f9e;--slate:#2c3a4b;--accent:var(--ru);--accent-soft:rgba(58,100,168,.12);--on-accent:#fff;
    --ok:#3f8a5a;--warn:#b8473b;--r:10px;--shadow:0 1px 2px rgba(20,30,50,.06),0 8px 28px rgba(20,30,50,.07);
    --mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#131816;--surface:#1b211f;--surface-2:#232a27;--panel:#0d1210;
      --ink:#e7ebe8;--ink-soft:#94a09b;--ink-faint:#6f7a75;--line:#2c3431;--line-soft:#222826;
      --ru:#7ea3e6;--es:#e0a04a;--audio:#c393d4;--slate:#94a09b;--accent-soft:rgba(126,163,230,.16);--on-accent:#131816;
      --ok:#7fb592;--warn:#e48478;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--line)}
  .row-top{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .timer,.streak{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .timer .ic{color:var(--accent)}.timer .lab{font-weight:400;font-size:10px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
  .logo{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em}.logo b{color:var(--accent)}
  .langwrap{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
  .lang-label{font-size:12px;color:var(--ink-soft);font-weight:500}
  .toggle{display:inline-flex;background:var(--surface-2);border:1.5px solid var(--ink);border-radius:999px;padding:3px}
  .toggle button{border:0;background:transparent;font-family:var(--body);font-weight:600;font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer;color:var(--ink);transition:.15s;display:flex;align-items:center;gap:7px}
  .toggle button .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
  .toggle button[data-l="ru"] .dot{background:var(--ru)}.toggle button[data-l="es"] .dot{background:var(--es)}.toggle button[data-l="zh"] .dot{background:var(--audio)}
  .toggle button.active{background:var(--accent);color:var(--on-accent,#fff)}.toggle button.active .dot{background:var(--on-accent,#fff);border-color:var(--on-accent,#fff)}
  .prog{max-width:1080px;margin:0 auto;padding:2px 18px 10px;display:flex;align-items:center;gap:12px}
  .labbr{display:none}
  .bottomnav{display:none}
  @media(max-width:640px){
    .sections{display:none}
    .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(5px + env(safe-area-inset-bottom));gap:4px}
    .bottomnav button{flex:1;border:0;background:transparent;font-family:var(--disp);font-weight:600;font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:9px;cursor:pointer}
    .bottomnav button .bic{font-size:19px;line-height:1}
    .bottomnav button.active{color:var(--accent);background:var(--accent-soft)}
    .flashcard{height:185px}
    .fc-face .big{font-size:23px}.fc-back .big{font-size:21px}
    .fc-stage{margin-top:8px}
    .fc-ctrl{margin-top:10px}
    .btn{padding:9px 13px;font-size:13px}
  }
  @media(max-width:640px){
    .row-top{padding:5px 8px;gap:4px;flex-wrap:nowrap}
    .logo{display:none}
    .lang-label{display:none}
    .lfull{display:none}
    .labbr{display:inline}
    .timer .lab{display:none}
    .timer,.streak{padding:3px 6px;font-size:11px;gap:3px;border-radius:6px}
    #lvl button{width:18px !important;height:18px !important;font-size:10px !important}
    .toggle{padding:2px}
    .toggle button{padding:4px 8px;font-size:11px;gap:4px}
    .toggle button .dot{width:6px;height:6px}
    .langwrap{margin-left:auto}
    .prog{padding:0 8px 4px;gap:6px}
    .plab{display:none}
    .prog .ptrack{height:5px}
    .pnum{font-size:10px}
    nav{padding:0 8px}
    .sections{padding:4px 0 2px;gap:3px}
    .sections button{padding:5px 2px;font-size:11px;border-radius:7px}
    .tabs{padding:4px 0 6px;gap:3px}
    .tabs button{padding:5px 9px;font-size:11.5px;gap:4px;border-radius:7px}
    .tabs button .ix{font-size:8px}
    .view{padding-top:6px}
    main{padding:6px 10px calc(78px + env(safe-area-inset-bottom))}
    .head{margin:10px 0 4px}
    .head h1{font-size:24px}
  }
  .prog .plab{font-size:11.5px;font-family:var(--mono);color:var(--ink-soft);white-space:nowrap}
  .prog .ptrack{flex:1;height:8px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
  .prog .ptrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--slate));border-radius:6px;transition:width .4s}
  .prog .pnum{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;min-width:96px;text-align:right}
  nav{max-width:1080px;margin:0 auto;padding:0 18px;border-top:1px solid var(--line-soft)}
  .sections{display:flex;gap:6px;padding:9px 0 2px}
  .sections button{flex:1;border:1px solid var(--line);background:var(--surface);padding:9px 8px;border-radius:8px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:13px;color:var(--ink-soft);transition:.15s}
  .sections button.active{background:var(--slate);border-color:var(--slate);color:var(--on-accent,#fff)}
  .dlgwrap{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .dbub{max-width:88%;padding:11px 14px;border-radius:14px;border:1px solid var(--line)}
  .dbub.them{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
  .dbub.you{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent);border-bottom-right-radius:4px}
  .dbub .dt{font-family:var(--disp);font-weight:600;font-size:17px}
  .dbub .df{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:2px}
  .dbub .dp{font-size:13px;color:var(--ink-soft);margin-top:3px}
  .dopt{width:100%;border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;cursor:pointer;text-align:left;transition:.12s;margin-bottom:8px}
  .dopt:hover{border-color:var(--accent)}
  .dopt.wrong{background:rgba(199,82,43,.10);border-color:var(--warn)}
  .dopt .ot{font-family:var(--disp);font-weight:600;font-size:17px;color:var(--ink)}
  .dopt .of{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:1px}
  .dopt .op{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:thin}
  .tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:9px 13px;border-radius:8px;cursor:pointer;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:.15s}
  .tabs button .ix{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .tabs button:hover{border-color:var(--accent);color:var(--ink)}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}.tabs button.active .ix{color:var(--on-accent,#fff);opacity:.7}
  main{max-width:1080px;margin:0 auto;padding:8px 18px 80px;isolation:isolate;background:var(--bg)}
  .view{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .head{margin:20px 0 6px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
  h1{font-family:var(--disp);font-weight:600;font-size:clamp(25px,4vw,36px);letter-spacing:-.02em;margin:6px 0 4px;line-height:1.1}
  h2{font-family:var(--disp);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
  h2 .num{font-family:var(--mono);font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px 7px}
  .lede{color:var(--ink-soft);max-width:62ch;font-size:15.5px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .note{background:var(--surface-2);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;margin:14px 0;font-size:14.5px;color:var(--ink)}
  .note b{color:var(--accent)}
  .readbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
  .btn{border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:9px;cursor:pointer;font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink);transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff)}.btn.primary:hover{color:var(--on-accent,#fff);filter:brightness(.95)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent,#fff)}.btn.ok:hover{color:var(--on-accent,#fff);filter:brightness(.95)}
  .btn.ghost{background:transparent}.btn.small{padding:7px 11px;font-size:12.5px}
  .grid{display:grid;gap:10px;margin-top:14px}
  .g-letters{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.g-word{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;transition:.15s;position:relative}
  .tile:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
  .tile .target{font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:-.01em}
  .tile .ipa{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:2px;font-weight:500}
  .tile .pl{color:var(--ink-soft);font-size:14px;margin-top:6px}
  .tile .badge{position:absolute;top:11px;right:11px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
  .tile .mnem{color:var(--ink);font-size:13.5px;margin-top:6px;font-style:italic}.tile .mnem b{font-style:normal;color:var(--accent)}
  .say{border:1px solid var(--line);background:var(--surface-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;display:inline-grid;place-items:center;transition:.15s;color:var(--ink-soft);vertical-align:middle}
  .say:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .tile .say{position:absolute;bottom:11px;right:11px}.tile.word,.tile.mnemtile{padding-right:48px}
  .verbpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
  .verbpick button{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-soft);transition:.15s}
  .verbpick button .gl{color:var(--ink-faint);margin-left:6px}
  .verbpick button.active{background:var(--slate);border-color:var(--slate);color:var(--on-accent,#fff)}.verbpick button.active .gl{color:var(--on-accent,#fff);opacity:.65}
  .machine{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:760px){.machine{grid-template-columns:1.35fr 1fr}}
  .ftable{width:100%;border-collapse:collapse;font-size:14.5px;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
  .ftable th{background:var(--surface-2);text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);padding:9px 12px;font-weight:500}
  .ftable td{padding:9px 12px;border-top:1px solid var(--line-soft);font-size:14px}
  .ftable td.osoba{font-family:var(--mono);color:var(--ink-soft)}.ftable td.forma{font-family:var(--disp);font-weight:600;font-size:17px}
  .ftable td.forma .stem{color:var(--ink)}.ftable td.forma .end{color:var(--accent);font-weight:700;background:var(--accent-soft);border-radius:4px;padding:0 3px}
  .ftable td.phon{font-family:var(--mono);font-size:12.5px;color:var(--accent)}.ftable td.tr{color:var(--ink-soft)}
  .refcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .refcard h4{font-family:var(--disp);font-size:14px;margin:0 0 10px}
  .refrow{font-family:var(--mono);font-size:12.5px;margin:7px 0;color:var(--ink)}.refrow b{color:var(--accent)}
  .vstatus{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:6px;display:inline-block;margin-bottom:10px}
  .vstatus.reg{background:rgba(46,139,87,.12);color:var(--ok)}.vstatus.irr{background:rgba(199,82,43,.12);color:var(--warn)}
  .colorkey{font-size:12.5px;color:var(--ink-soft);margin-top:8px}.colorkey .end{color:var(--accent);font-weight:700;background:var(--accent-soft);border-radius:4px;padding:0 4px}
  .guide p{font-size:15.5px;max-width:66ch;color:var(--ink)}
  .principle{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
  .principle .p-no{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--on-accent,#fff);background:var(--accent);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
  .principle h3{font-family:var(--disp);font-size:17px;margin:2px 0 6px;letter-spacing:-.01em}.principle p{margin:0;color:var(--ink-soft);font-size:14.5px}
  .principle .formula{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:6px;padding:6px 9px;margin-top:9px;display:inline-block}
  .panel{padding:20px}.curve-wrap{display:grid;grid-template-columns:1fr;gap:16px;margin-top:8px}@media(min-width:760px){.curve-wrap{grid-template-columns:1fr 1fr}}
  .barrow{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:13.5px}.barrow .lab{width:120px;font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
  .bar{flex:1;height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line-soft)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--slate));border-radius:6px}
  .barrow .val{width:42px;text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--accent)}
  .sgroup{margin-top:22px}.sgroup h3{font-family:var(--disp);font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:9px}.sgroup h3 .tick{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .sent{display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
  .sent .body{flex:1}.sent .t{font-family:var(--disp);font-weight:600;font-size:17px}.sent .f{font-family:var(--mono);font-size:12.5px;color:var(--accent);margin-top:2px}.sent .p{color:var(--ink-soft);font-size:14px;margin-top:4px}
  .fc-stage{display:grid;place-items:center;margin-top:18px}.flashcard{width:min(460px,100%);height:250px;perspective:1400px;cursor:pointer}
  .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}.flashcard.flip .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;padding:24px}
  .fc-back{transform:rotateY(180deg);background:var(--panel);color:#fff;border-color:var(--panel)}
  .fc-face .lbl{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}.fc-back .lbl{color:rgba(255,255,255,.5)}
  .fc-face .known-tag{position:absolute;top:13px;right:16px;font-family:var(--mono);font-size:10.5px;color:var(--ok)}
  .fc-face .big{font-family:var(--disp);font-weight:600;font-size:30px;letter-spacing:-.02em}.fc-back .big{font-size:28px}
  .fc-back .fon{font-family:var(--mono);font-size:15px;color:#E0B774;margin-top:10px}
  .fc-face .sub{font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-top:10px}.fc-back .sub{color:rgba(255,255,255,.55);margin-top:8px}
  .fc-ctrl{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}.counter{font-family:var(--mono);font-size:13px;color:var(--ink-soft);min-width:70px;text-align:center}
  .spell{max-width:600px;margin:18px auto 0}.spell-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
  .spell .prompt{font-family:var(--disp);font-weight:600;font-size:26px;text-align:center}.spell .promptsub{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:6px}
  .spell .hintline{text-align:center;font-family:var(--mono);font-size:14px;color:var(--accent);min-height:20px;margin:10px 0}
  .spell input{width:100%;font-family:var(--disp);font-size:24px;text-align:center;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);outline:none;transition:.15s}
  .spell input:focus{border-color:var(--accent);background:var(--surface)}
  .keys{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:12px 0 4px}
  .keys button{font-family:var(--mono);font-size:13px;min-width:30px;padding:6px 8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;color:var(--ink);transition:.1s}
  .keys button:hover{background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent)}.keys button.util{color:var(--ink-soft);font-size:11px}
  .spell-ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .result{margin-top:16px;border-radius:10px;padding:16px;text-align:center;border:1px solid var(--line);background:var(--surface-2)}
  .result .status{font-family:var(--disp);font-weight:600;font-size:18px;margin-bottom:8px}
  .result.good .status{color:var(--ok)}.result.almost .status{color:var(--es)}.result.bad .status{color:var(--warn)}
  .result .diff{font-family:var(--mono);font-size:22px;letter-spacing:1px;margin:6px 0}
  .result .dc.ok{color:var(--ok)}.result .dc.bad{color:var(--warn);text-decoration:underline}.result .dc.miss{color:var(--ink-faint)}

const RU_V=new Set(['а','е','ё','и','о','у','ы','э','ю','я']);
function ruLetterSay(l){if(l==='ъ'||l==='ь')return '';if(l==='й')return 'ай';if(RU_V.has(l))return l;return l+'а';}
function ruLow(d){const p=d.trim().split(/\s+/);return (p[1]||p[0]).toLowerCase();}
function lcp(a){if(!a.length)return '';let p=a[0];for(const s of a){let i=0;while(i<p.length&&i<s.length&&p[i].toLowerCase()===s[i].toLowerCase())i++;p=p.slice(0,i);}return p;}
function stripAcc(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function normSpell(s,l){s=String(s).trim().toLowerCase().replace(/[?!.…¿¡]+/g,'').replace(/\s+/g,' ');if(l==='ru')s=s.replace(/ё/g,'е');return s;}
function lev(a,b){const m=a.length,n=b.length;const dp=[];for(let i=0;i<=m;i++){dp.push([i]);for(let j=1;j<=n;j++)dp[i].push(i===0?j:0);}for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n];}
function sim(a,b){if(!a&&!b)return 1;return 1-lev(a,b)/Math.max(a.length,b.length,1);}

function levelItems(lang,lvl){let o=[];if(lvl===1){const d=DATA[lang];d.phrases.forEach(r=>o.push({t:r[0],f:r[1],p:r[2]}));Object.values(d.vocab).forEach(a=>a.forEach(r=>o.push({t:r[0],f:r[1],p:r[2]})));d.numbers.forEach(r=>o.push({t:r[0],f:r[1],p:"liczba "+r[2]}));d.pronouns.forEach(r=>o.push({t:r[0],f:r[1],p:r[2]}));}else{const d=extra(lang,lvl);if(d){(d.phrases||[]).forEach(r=>o.push({t:r[0],f:r[1],p:r[2]}));Object.values(d.vocab||{}).forEach(a=>a.forEach(r=>o.push({t:r[0],f:r[1],p:r[2]})));}}return o;}

function viewGuide(){const pr=[["Atakuj najczęstsze słowa (Pareto/Zipf)","Częstość słów spada wykładniczo; mały rdzeń pokrywa większość mowy.","≈100→~50% · ≈1000→~80%"],["Powtórki rozłożone (krzywa zapominania)","M(t)=e^(−t/τ). Powtórka tuż przed zapomnieniem wydłuża τ.","1d→3→7→16→35"],["Aktywne przywoływanie > bierne czytanie","Ślad wzmacnia wysiłek przypomnienia: Fiszki, Słuchanie, Mówienie, Pisownia, Quiz.","recall > recognition"],["Gramatyka jako system","forma = temat + końcówka(osoba). Kolor w zakładce 04 pokazuje, co się zmienia.","forma = temat ∘ końcówka"],["Mowa first","Używaj Słuchania i Mówienia, mów na głos za 🔊. Pisownia to wsparcie.","input ↔ output"],["Chunking","Ucz się gotowych zdań (Zdania) i składaj własne (Generator).","1 fraza < 4 słowa"],["Regularność > intensywność","Krótko, codziennie. Pilnuje tego seria dni 🔥 i licznik sesji ⏱.","konsystencja > zryw"]];

function forgetCurveSVG(){const W=320,H=180,pad=24,x0=pad,x1=W-8,y0=8,y1=H-pad,span=x1-x0,hgt=y1-y0;function dec(t,tau){return Math.exp(-t/tau);}const rs=[0,.18,.40,.66],ts=[.10,.18,.30,.55];let s="";for(let i=0;i<rs.length;i++){const a=rs[i],b=(i<rs.length-1)?rs[i+1]:1,tau=ts[i];let d="";for(let f=0;f<=1;f+=0.04){const gx=x0+(a+(b-a)*f)*span;const gy=y0+(1-dec((b-a)*f,tau))*hgt*.95;d+=(f===0?"M":"L")+gx.toFixed(1)+" "+gy.toFixed(1)+" ";}s+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.4"/>';if(i>0){const rx=x0+a*span;s+='<line x1="'+rx+'" y1="'+y0+'" x2="'+rx+'" y2="'+y1+'" stroke="var(--slate)" stroke-dasharray="3 3" opacity=".55"/>';}}return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:360px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px"><line x1="'+x0+'" y1="'+y1+'" x2="'+x1+'" y2="'+y1+'" stroke="var(--line)"/><line x1="'+x0+'" y1="'+y0+'" x2="'+x0+'" y2="'+y1+'" stroke="var(--line)"/>'+s+'</svg>';}

function viewVerbs(){const d=DATA[state.lang],v=d.verbs[state.verbIdx];const forms=v.rows.map(r=>r[1]);const stem=lcp(forms);const rows=v.rows.map(r=>{const f=r[1],st=f.slice(0,stem.length),en=f.slice(stem.length);return '<tr><td class="osoba">'+esc(r[0])+'</td><td class="forma">'+(st?'<span class="stem">'+esc(st)+'</span>':'')+'<span class="end">'+esc(en)+'</span></td><td class="phon">'+esc(r[2])+'</td><td class="tr">'+esc(r[3])+'</td><td>'+sayBtn(r[1])+'</td></tr>';}).join('');const refCols=d.ref.map(r=>({h:r[0].replace(' koniugacja','').replace('grupa ',''),ends:r[1].split(' · ')}));const refTable='<div style="overflow-x:auto"><table class="ftable" style="font-size:13px"><tr><th>osoba</th>'+refCols.map(c=>'<th>'+esc(c.h)+'</th>').join('')+'</tr>'+v.rows.map((row,i)=>'<tr><td class="osoba">'+esc(row[0])+'</td>'+refCols.map(c=>'<td class="phon" style="font-weight:700">'+esc(c.ends[i]||'')+'</td>').join('')+'</tr>').join('')+'</table></div>';return '<div class="view"><div class="head"><div class="eyebrow">04 · System</div><h1>Czasowniki — odmiana z wymową</h1></div><div class="note">'+d.verbsNote+'</div><div class="verbpick">'+d.verbs.map((vb,i)=>'<button class="'+(i===state.verbIdx?'active':'')+'" data-verb="'+i+'">'+esc(vb.inf)+'<span class="gl">'+vb.gloss+'</span></button>').join('')+'</div>'+readbar('Przesłuchaj odmianę (PL + '+(state.lang==='ru'?'RU':'ES')+')')+'<div class="machine"><table class="ftable"><tr><th>osoba</th><th>forma</th><th>wymowa</th><th>tłumaczenie</th><th></th></tr>'+rows+'</table><div class="refcard"><div class="vstatus '+(v.reg?'reg':'irr')+'">'+(v.reg?'✓ regularny — '+esc(v.type):'△ '+esc(v.type)+' — formy na pamięć')+'</div><h4>Macierz końcówek (pionowo)</h4>'+refTable+'<div class="colorkey">Na <span class="end">kolorowo</span> część zmienna (zależna od osoby).</div></div></div></div>';}

/* ---- Generator ---- */
function newGen(){const d=DATA[state.lang],per=d.persons,verbs=d.verbs,comp=d.compl;
  const vc=VCOMPL[state.lang],vKeys=Object.keys(vc).map(Number);
  const gv=vKeys[Math.floor(Math.random()*vKeys.length)];
  const allowed=vc[gv];const gc=allowed[Math.floor(Math.random()*allowed.length)];
  const gp=Math.floor(Math.random()*per.length);
  const v=verbs[gv],row=v.rows[gp],pr=per[gp],cp=comp[gc];
  const correctSeq=[pr[0],row[1],cp[0]];
  const phon=[pr[1],row[2],cp[1]].join(' ');
  const goalPol=pr[2]+' '+row[3]+' '+cp[2];
  let dist=[];
  let dp=(gp+1+Math.floor(Math.random()*4))%per.length;if(dp===gp)dp=(dp+1)%per.length;
  if(correctSeq.indexOf(v.rows[dp][1])<0)dist.push(v.rows[dp][1]);
  let dc=gc,tries=0;while((dc===gc||correctSeq.indexOf(comp[dc][0])>=0)&&tries<12){dc=1+Math.floor(Math.random()*(comp.length-1));tries++;}
  if(correctSeq.indexOf(comp[dc][0])<0)dist.push(comp[dc][0]);
  const tiles=shuffle(correctSeq.concat(dist)).map((w,i)=>({id:i,w}));
  state.gen={correctSeq,sentence:correctSeq.join(' '),phon,goalPol,tiles,chosen:[],answered:false,correct:false};
}

let raceTimer=null;
function raceStop(){if(raceTimer){clearInterval(raceTimer);raceTimer=null;}}
function raceBest(l,m){const s=loadStore();return (s.race&&s.race[l+'_'+m])||0;}
function raceSaveBest(l,m,v){const s=loadStore();s.race=s.race||{};const k=l+'_'+m;if(v>(s.race[k]||0)){s.race[k]=v;saveStore(s);}}
function startRace(){const mode=state.race?state.race.mode:'text';state.race={phase:'play',mode:mode,timeLeft:60,score:0,combo:0,maxCombo:0,best:raceBest(state.lang,mode),locked:false,deck:shuffle(shortDeck(state.lang)),current:null};}
function raceNewQ(){const r=state.race,deck=r.deck,item=deck[Math.floor(Math.random()*deck.length)];let answer,opts;if(r.mode==='audio'){answer=item.p;const w=shuffle(deck.filter(c=>c.p!==item.p)).slice(0,3).map(c=>c.p);opts=shuffle([item.p,...w]);}else{answer=item.t;const w=shuffle(deck.filter(c=>c.t!==item.t)).slice(0,3).map(c=>c.t);opts=shuffle([item.t,...w]);}r.current={prompt:item.p,answer:answer,opts:opts,audio:item.t};}
function renderRaceQuestion(){const r=state.race,q=document.getElementById('raceQ'),sub=document.getElementById('raceSub'),op=document.getElementById('raceOpts');if(!q||!op)return;if(r.mode==='audio'){q.innerHTML='<button class="mic" id="racePlay" style="width:72px;height:72px;font-size:28px">🔊</button>';if(sub)sub.textContent='Posłuchaj i wybierz znaczenie';const pb=document.getElementById('racePlay');if(pb)pb.onclick=()=>speak(r.current.audio);speak(r.current.audio);}else{q.textContent=r.current.prompt;if(sub)sub.textContent='Kliknij tłumaczenie na '+DATA[state.lang].name;}op.innerHTML=r.current.opts.map((o,i)=>'<button class="q-opt" data-ropt="'+i+'">'+esc(o)+'</button>').join('');op.querySelectorAll('[data-ropt]').forEach(b=>b.onclick=()=>raceAnswer(+b.dataset.ropt));}
function paintRaceHUD(){const r=state.race;if(!r)return;const t=document.getElementById('raceTime'),b=document.getElementById('raceBar'),s=document.getElementById('raceScore'),c=document.getElementById('raceCombo');if(t)t.textContent=Math.max(0,r.timeLeft);if(b)b.style.width=(Math.max(0,r.timeLeft)/60*100)+'%';if(s)s.textContent=r.score;if(c)c.textContent='x'+r.combo;}
function raceAnswer(idx){const r=state.race;if(!r||r.locked||r.phase!=='play')return;r.locked=true;const correct=r.current.opts[idx]===r.current.answer;document.querySelectorAll('#raceOpts .q-opt').forEach((o,i)=>{if(r.current.opts[i]===r.current.answer)o.classList.add('correct');else if(i===idx)o.classList.add('wrong');});if(correct){r.combo++;r.maxCombo=Math.max(r.maxCombo,r.combo);r.score+=10+(r.combo-1)*5;srsHit(r.current.audio);statHit('race',true);}else{r.combo=0;srsMiss(r.current.audio);statHit('race',false);}paintRaceHUD();setTimeout(()=>{if(!state.race||state.race.phase!=='play')return;r.locked=false;raceNewQ();renderRaceQuestion();},240);}
function raceTick(){const r=state.race;if(!r||r.phase!=='play')return;r.timeLeft--;paintRaceHUD();if(r.timeLeft<=0)raceEnd();}

function buildRead(){const d=DATA[state.lang],lang=state.lang,lv=lvlOf(),tl=TL(),pl=PL();let s=[];if(state.tab==='alpha'){d.alphabet.forEach(a=>{const say=(state.lang==='ru')?ruLetterSay(ruLow(a[0])):(a[3]||a[0]);if(say)s.push({t:say,lang:tl});});}else if(state.tab==='numbers'){d.numbers.forEach(n=>s.push({t:n[0],lang:tl}));}else if(state.tab==='pron'){d.pronouns.forEach(r=>{s.push({t:r[0],lang:tl});s.push({t:r[2],lang:pl});});}else if(state.tab==='phrases'){let ph=d.phrases.slice();for(let k=2;k<=lv;k++){const e=extra(lang,k);if(e&&e.phrases)ph=ph.concat(e.phrases);}ph.forEach(r=>{s.push({t:r[0],lang:tl});s.push({t:r[2],lang:pl});});}else if(state.tab==='sentences'){let gr=d.sentences.slice();for(let k=2;k<=lv;k++){const e=extra(lang,k);if(e&&e.sentences)gr=gr.concat(e.sentences);}gr.forEach(g=>g.items.forEach(r=>{s.push({t:r[0],lang:tl});s.push({t:r[2],lang:pl});}));}else if(state.tab==='vocab'){const cur=vocabCats(lang).find(c=>c.name===state.vocabCat);(cur?cur.items:[]).forEach(r=>{s.push({t:r[0],lang:tl});s.push({t:r[2],lang:pl});});}else if(state.tab==='verbs'){const v=d.verbs[state.verbIdx];s.push({t:v.inf,lang:tl});s.push({t:v.gloss,lang:pl});v.rows.forEach(r=>{s.push({t:r[1],lang:tl});s.push({t:r[3],lang:pl});});}return s;}

function dlgBubble(side,t,f,p,showPl){return '<div class="dbub '+side+'"><div class="dt">'+esc(t)+' '+sayBtn(t)+'</div><div class="df">['+esc(f)+']</div>'+(showPl?'<div class="dp">'+esc(p)+'</div>':'')+'</div>';}
function dlgPool(){const lang=state.lang,lv=lvlOf();let o=[];DLG[lang].forEach((d,i)=>{if(d.lvl<=lv)o.push(i);});return o;}
function dlgResolveThem(){const d=DLG[state.lang][state.dlg.di];let guard=0;while(state.dlg.node!=null&&guard++<50){const nd=d.n[state.dlg.node];if(nd[0]!=='m')break;state.dlg.trail.push({ty:'m',ni:state.dlg.node});const nx=nd[4];if(nx===-1){state.dlg.done=true;state.dlg.node=null;}else state.dlg.node=nx;}}
function dlgStart(){const pool=dlgPool();if(!pool.length){state.dlg=null;return;}const di=pool[Math.floor(Math.random()*pool.length)];state.dlg={di:di,node:0,trail:[],done:false};dlgResolveThem();}
function dlgChoose(oi){const d=DLG[state.lang][state.dlg.di],nd=d.n[state.dlg.node],opt=nd[1][oi],nx=opt[3];if(nx==='x')return false;state.dlg.trail.push({ty:'y',ni:state.dlg.node,oi:oi});if(nx===-1){state.dlg.done=true;state.dlg.node=null;}else{state.dlg.node=nx;dlgResolveThem();}return true;}

  const rno=document.getElementById('revNo');if(rno)rno.onclick=()=>{const d=dueList(state.lang);if(d.length){srsMiss(d[Math.min(state.revIdx,d.length-1)].t);state.revFlip=false;render();}};
  const mp=document.getElementById('mwPlay');if(mp)mp.onclick=()=>{if(state.mw)speak(state.mw.item.t);};
  document.querySelectorAll('[data-mw]').forEach(b=>b.onclick=()=>{const M=state.mw;if(!M||M.answered)return;M.answered=true;const chosen=M.opts[+b.dataset.mw];M.correct=(chosen===M.answer);document.querySelectorAll('#mwOpts .q-opt').forEach((o,i)=>{if(M.opts[i]===M.answer)o.classList.add('correct');else if(i===+b.dataset.mw)o.classList.add('wrong');});const fb=document.getElementById('mwFeedback');if(fb)fb.innerHTML=M.correct?'<span style="color:var(--ok);font-weight:700">✓ Dobrze!</span>':'<span style="color:var(--warn);font-weight:700">✕ Poprawnie: '+esc(M.answer)+'</span>';if(M.correct){srsHit(M.item.t);statHit('missing',true);}else{srsMiss(M.item.t);statHit('missing',false);}speak(M.item.t);setTimeout(()=>{if(state.tab!=='missing')return;newMW();render();},1500);});
  const cn=document.getElementById('cnPlay');if(cn)cn.onclick=()=>{playSeq(CHINA.map(c=>({t:c[4]||c[0],lang:'zh-CN'})));};
  document.querySelectorAll('[data-zhmode]').forEach(b=>b.onclick=()=>{stopSeq();state.zhMode=b.dataset.zhmode;if(state.zhMode==='cards'){state.zhDeck=shuffle(CHINA.map((_,i)=>i));state.zhIdx=0;state.zhFlip=false;}render();});
  const zc=document.getElementById('zhCard');if(zc)zc.onclick=()=>{state.zhFlip=!state.zhFlip;render();};
  const zsh=document.getElementById('zhShuffle');if(zsh)zsh.onclick=()=>{state.zhDeck=shuffle(CHINA.map((_,i)=>i));state.zhIdx=0;state.zhFlip=false;render();};
  const zn=document.getElementById('zhNext');if(zn)zn.onclick=()=>{zhEnsureDeck();state.zhIdx++;if(state.zhIdx>=state.zhDeck.length){state.zhDeck=shuffle(CHINA.map((_,i)=>i));state.zhIdx=0;}state.zhFlip=false;render();};
  const qr=document.getElementById('quizRestart');if(qr)qr.onclick=()=>{startQuiz();render();};
  const dn=document.getElementById('dlgNew');if(dn)dn.onclick=()=>{stopSeq();dlgStart();render();};
  const dn2=document.getElementById('dlgNew2');if(dn2)dn2.onclick=()=>{stopSeq();dlgStart();render();};
  document.querySelectorAll('[data-dopt]').forEach(b=>b.onclick=()=>{const ok=dlgChoose(+b.dataset.dopt);if(ok){render();requestAnimationFrame(()=>{const tgt=document.querySelector('.q-sub')||document.querySelector('.result');if(tgt)tgt.scrollIntoView({behavior:'smooth',block:'center'});});}else{b.classList.add('wrong');const h=document.getElementById('dlgHint');if(h)h.textContent='Spróbuj jeszcze raz — posłuchaj ponownie 🔊';}});
  const dr=document.getElementById('dlgReplay');if(dr)dr.onclick=()=>{const d=DLG[state.lang][state.dlg.di];const seq=state.dlg.trail.map(e=>{const nd=d.n[e.ni];return e.ty==='m'?{t:nd[1],lang:TL()}:{t:nd[1][e.oi][0],lang:TL()};});playSeq(seq);};
  if(state.tab==='race'&&state.race){const r=state.race;
    if(r.phase==='start'){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{r.mode=b.dataset.mode;render();});const st=document.getElementById('raceStart');if(st)st.onclick=()=>{startRace();render();};}
    else if(r.phase==='play'){if(!r.current)raceNewQ();renderRaceQuestion();raceStop();raceTimer=setInterval(raceTick,1000);}
    else if(r.phase==='done'){const a=document.getElementById('raceAgain');if(a)a.onclick=()=>{startRace();render();};const m=document.getElementById('raceMenu');if(m)m.onclick=()=>{state.race={phase:'start',mode:r.mode};render();};}
  }
}
document.getElementById('bottomnav').addEventListener('click',e=>{const b=e.target.closest('[data-sec]');if(!b)return;stopSeq();stopRecog();raceStop();state.race=null;const s=SECTIONS.find(x=>x.id===b.dataset.sec);if(s){state.tab=s.tabs[0];render();window.scrollTo(0,0);}});
document.getElementById('sections').addEventListener('click',e=>{const b=e.target.closest('[data-sec]');if(!b)return;stopSeq();stopRecog();raceStop();state.race=null;const s=SECTIONS.find(x=>x.id===b.dataset.sec);if(s){state.tab=s.tabs[0];render();window.scrollTo(0,0);}});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;stopSeq();stopRecog();raceStop();state.race=null;state.tab=b.dataset.tab;render();window.scrollTo(0,0);});
document.getElementById('lvl').addEventListener('click',e=>{const b=e.target.closest('[data-rng]');if(!b)return;const n=+b.dataset.rng;if(n===state.level[state.lang])return;state.level[state.lang]=n;saveLevel();stopSeq();state.vocabCat=null;state.fcDeck=[];state.fcIdx=0;state.quiz=null;state.spellDeck=[];state.spellIdx=0;state.listen=null;state.dlg=null;state.mw=null;state.revIdx=0;render();});
document.getElementById('langToggle').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;stopSeq();stopRecog();raceStop();state.lang=b.dataset.l;state.verbIdx=0;state.vocabCat=null;state.fcDeck=[];state.fcIdx=0;state.fcFlip=false;state.quiz=null;state.spellDeck=[];state.spellIdx=0;state.spellChecked=false;state.genPerson=0;state.genVerb=0;state.genCompl=0;state.gen=null;state.listen=null;state.speakItem=null;state.race=null;state.hardIdx=0;state.hardFlip=false;state.dlg=null;state.revIdx=0;state.revFlip=false;state.mw=null;render();window.scrollTo(0,0);});

/* init: restore known + streak */
(function(){const st=loadStore();if(st.known){if(st.known.ru)state.known.ru=new Set(st.known.ru);if(st.known.es)state.known.es=new Set(st.known.es);}if(st.hard){if(st.hard.ru)state.hard.ru=new Set(st.hard.ru);if(st.hard.es)state.hard.es=new Set(st.hard.es);}if(st.level){state.level.ru=st.level.ru||1;state.level.es=st.level.es||1;}if(st.srs){if(st.srs.ru)state.srs.ru=st.srs.ru;if(st.srs.es)state.srs.es=st.srs.es;}if(st.stats){if(st.stats.ru)state.stats.ru=st.stats.ru;if(st.stats.es)state.stats.es=st.stats.es;}['ru','es'].forEach(lg=>{state.known[lg].forEach(t=>{if(!state.srs[lg][t])state.srs[lg][t]={box:4,hits:1,misses:0,due:todayDay()+SRS_INT[4]};});});initStreak();initDaily();})();
timerStart();timerPaint();render();
</script>
</body>
</html>
