name: Supabase keep-alive
on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Brak danych w config.js"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/hub_kv?select=key&limit=1" -H "apikey: $KEY")
          echo "Supabase odpowiedział: HTTP $code"
          test "$code" = "200"
      - name: Keep repository active
        run: |
          if [ "$(date -u +%-d)" -le 3 ]; then
            date -u > .keepalive
            git config user.name "hub-keepalive"
            git config user.email "hub-keepalive@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive" && git push
          fi
